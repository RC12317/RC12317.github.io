<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rosa · SQL, Power BI and Python Portfolio</title>
  <meta name="description" content="Portfolio of SQL, Power BI and Python practice by a cybersecurity engineer in training.">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply saved theme before paint to avoid a flash
    try {
      var t = localStorage.getItem("theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>

<header class="site-header">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle topic menu">☰</button>
  <a class="brand" href="#/">
    <span class="brand-mark">RC</span>
    <span class="brand-text">Rosa's Portfolio</span>
  </a>
  <nav class="top-nav" id="topNav" aria-label="Main sections"></nav>
  <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark theme">🌙</button>
</header>

<div class="layout" id="layout">
  <aside class="sidebar" id="sidebar" aria-label="Topics"></aside>
  <main id="main"><div class="content" id="content">Loading…</div></main>
</div>

<footer class="site-footer">
  © <span id="year"></span> RC12317 ·
  <a href="https://github.com/RC12317" target="_blank" rel="noopener">GitHub</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------
     SITE MAP: edit this to add a topic or a section.
     Every topic is a folder containing a README.md.
     ------------------------------------------------------------ */
  var CORE = [
    ["01-Filtering-and-Sorting",    "Filtering and Sorting"],
    ["02-Aggregates-GroupBy-Having","Aggregates, GroupBy, Having"],
    ["03-Data-Modification",        "Data Modification"],
    ["04-Subqueries",               "Subqueries"],
    ["05-Data-Migration",           "Data Migration"],
    ["06-CASE-Logic",               "CASE Logic"],
    ["07-Joins",                    "Joins"]
  ];

  var SECTIONS = {
    SQL: {
      label: "SQL", icon: "🗄️", cls: "sql",
      blurb: "Cleaned-up queries, notes and fixed mistakes. Practiced in SQL Server and SQLite.",
      status: "Active",
      topics: [["00-Setup", "Setup"]].concat(CORE, [["_Original-Practice-Log", "Original Practice Log"]])
    },
    PowerBI: {
      label: "Power BI", icon: "📊", cls: "powerbi",
      blurb: "The same topics in DAX and Power Query. Dashboards coming soon.",
      status: "Starter pages",
      topics: CORE
    },
    Python: {
      label: "Python", icon: "🐍", cls: "python",
      blurb: "The same topics re-solved with pandas, for automation and security tooling.",
      status: "Starter pages",
      topics: CORE
    }
  };
  var ORDER = ["SQL", "PowerBI", "Python"];

  var $ = function (id) { return document.getElementById(id); };
  var content = $("content");

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function num(folder) { var m = folder.match(/^(\d\d)-/); return m ? m[1] : "•"; }
  function topicTitle(section, folder) {
    var t = SECTIONS[section].topics.filter(function (x) { return x[0] === folder; })[0];
    return t ? t[1] : folder;
  }

  function highlight(root) {
    root.querySelectorAll("pre code").forEach(function (block) {
      var m = (block.className || "").match(/language-(\w+)/);
      var lang = m ? m[1] : "";
      if (lang && window.hljs && hljs.getLanguage(lang)) hljs.highlightElement(block);

      var pre = block.parentElement;
      var btn = document.createElement("button");
      btn.className = "copy-btn"; btn.type = "button"; btn.textContent = "Copy";
      btn.addEventListener("click", function () {
        navigator.clipboard.writeText(block.innerText).then(function () {
          btn.textContent = "Copied";
          setTimeout(function () { btn.textContent = "Copy"; }, 1500);
        });
      });
      pre.appendChild(btn);
    });
  }

  /* ---------- top nav + sidebar ---------- */
  function renderTopNav(active) {
    var html = '<a href="#/"' + (active === "" ? ' class="active"' : "") + ">Home</a>";
    ORDER.forEach(function (k) {
      html += '<a href="#/' + k + '"' + (active === k ? ' class="active"' : "") + ">" + SECTIONS[k].label + "</a>";
    });
    $("topNav").innerHTML = html;
  }

  function renderSidebar(section, topic) {
    var layout = $("layout");
    if (!section) { layout.classList.add("no-sidebar"); return; }
    layout.classList.remove("no-sidebar");
    var s = SECTIONS[section];
    var html = "<h2>" + esc(s.label) + "</h2>";
    html += '<a href="#/' + section + '"' + (!topic ? ' class="active"' : "") +
            '><span class="num">★</span>Overview</a>';
    s.topics.forEach(function (t) {
      html += '<a href="#/' + section + "/" + t[0] + '"' + (topic === t[0] ? ' class="active"' : "") +
              '><span class="num">' + num(t[0]) + "</span>" + esc(t[1]) + "</a>";
    });
    $("sidebar").innerHTML = html;
  }

  /* ---------- views ---------- */
  function renderHome() {
    document.title = "Rosa · SQL, Power BI and Python Portfolio";
    var cards = ORDER.map(function (k) {
      var s = SECTIONS[k];
      return '<a class="card ' + s.cls + '" href="#/' + k + '">' +
        '<span class="card-icon">' + s.icon + "</span>" +
        "<h3>" + s.label + "</h3><p>" + esc(s.blurb) + "</p>" +
        '<span class="meta">' + s.topics.length + " pages · " + esc(s.status) + " →</span></a>";
    }).join("");

    var rows = CORE.map(function (t) {
      return "<tr><td>" + num(t[0]) + " · " + esc(t[1]) + "</td>" +
        ORDER.map(function (k) {
          return '<td><a class="pill" href="#/' + k + "/" + t[0] + '">Open</a></td>';
        }).join("") + "</tr>";
    }).join("");

    content.innerHTML =
      '<div class="home">' +
      '<section class="hero">' +
      '<span class="eyebrow">Cybersecurity engineer in training</span>' +
      "<h1>Hi, I'm Rosa.<br>I turn data into answers.</h1>" +
      "<p>I'm building the technical foundation for security operations and defensive strategy. " +
      "SQL comes first, then Python for automation and security tools, and Power BI for dashboards.</p>" +
      '<div class="hero-cta">' +
      '<a class="btn primary" href="#/SQL">Start with SQL →</a>' +
      '<a class="btn" href="https://github.com/RC12317" target="_blank" rel="noopener">View GitHub</a>' +
      "</div></section>" +
      '<div class="section-cards">' + cards + "</div>" +
      "<h2>Same topics, three tools</h2>" +
      '<p class="sub">Every topic is solved in SQL first, then in Power BI and Python.</p>' +
      '<table class="matrix"><thead><tr><th>Topic</th><th>SQL</th><th>Power BI</th><th>Python</th></tr></thead>' +
      "<tbody>" + rows + "</tbody></table></div>";
  }

  // Turn relative links inside rendered Markdown into site routes
  function fixLinks(root, baseDir) {
    root.querySelectorAll("a[href]").forEach(function (a) {
      var href = a.getAttribute("href");
      if (/^(https?:|mailto:|#)/.test(href)) {
        if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; }
        return;
      }
      var path;
      try { path = decodeURIComponent(new URL(href, "http://x/" + baseDir).pathname.slice(1)); }
      catch (e) { return; }
      if (/README\.md$/.test(path)) {
        a.setAttribute("href", "#/" + path.replace(/\/?README\.md$/, ""));
      } else if (/\.(sql|csv|py|md|pbix)$/.test(path)) {
        a.setAttribute("href", "#/file/" + path);
      }
    });
  }

  function breadcrumb(parts) {
    var html = '<a href="#/">Home</a>';
    if (parts[0]) html += '<span class="sep">/</span><a href="#/' + parts[0] + '">' + esc(SECTIONS[parts[0]].label) + "</a>";
    if (parts[1]) html += '<span class="sep">/</span>' + esc(topicTitle(parts[0], parts[1]));
    return '<div class="breadcrumb">' + html + "</div>";
  }

  function pager(section, topic) {
    var list = SECTIONS[section].topics;
    var i = topic ? list.findIndex(function (t) { return t[0] === topic; }) : -1;
    var prev = i > 0 ? list[i - 1] : null;
    var next = i < list.length - 1 ? list[i + 1] : null;
    var html = '<div class="pager">';
    if (prev) html += '<a class="prev" href="#/' + section + "/" + prev[0] + '"><small>← Previous</small>' + esc(prev[1]) + "</a>";
    else if (topic) html += '<a class="prev" href="#/' + section + '"><small>← Back to</small>' + esc(SECTIONS[section].label) + " overview</a>";
    else html += '<span class="spacer"></span>';
    if (next) html += '<a class="next" href="#/' + section + "/" + next[0] + '"><small>Next →</small>' + esc(next[1]) + "</a>";
    else html += '<span class="spacer"></span>';
    return html + "</div>";
  }

  function fetchText(path) {
    return fetch(path).then(function (r) {
      if (!r.ok) throw new Error(r.status + " " + r.statusText);
      return r.text();
    });
  }

  function showError(path, err) {
    var local = location.protocol === "file:";
    content.innerHTML = '<div class="notice"><h2>Couldn’t load <code>' + esc(path) + "</code></h2>" +
      (local
        ? "<p>Browsers block loading files when a page is opened straight from disk. Run a tiny local server instead:</p>" +
          "<pre><code>python3 -m http.server 8000</code></pre><p>Then open <code>http://localhost:8000</code>.</p>"
        : "<p>" + esc(err.message) + '. Check that the file exists, or <a href="#/">go home</a>.</p>') +
      "</div>";
  }

  function renderMarkdown(parts) {
    var section = parts[0], topic = parts[1] || "";
    var dir = parts.join("/");
    var path = dir + "/README.md";
    renderSidebar(section, topic);
    fetchText(path).then(function (md) {
      var html = marked.parse(md);
      content.innerHTML = breadcrumb(parts) + '<article class="md">' + html + "</article>" + pager(section, topic);
      var art = content.querySelector(".md");
      fixLinks(art, dir + "/");
      highlight(art);
      var h1 = art.querySelector("h1");
      document.title = (h1 ? h1.textContent : topicTitle(section, topic)) + " · Rosa's Portfolio";
    }).catch(function (e) { showError(path, e); });
  }

  function renderFile(path) {
    var parts = path.split("/");
    var name = parts[parts.length - 1];
    var ext = (name.split(".").pop() || "").toLowerCase();
    var section = SECTIONS[parts[0]] ? parts[0] : "";
    renderSidebar(section, parts[1]);
    fetchText(path).then(function (text) {
      var back = "#/" + parts.slice(0, -1).join("/");
      content.innerHTML =
        '<div class="breadcrumb"><a href="' + back + '">← Back to page</a></div>' +
        '<div class="file-head"><h1>' + esc(name) + '</h1><span class="spacer"></span>' +
        '<a class="btn" href="' + esc(path) + '" download>Download</a></div>' +
        '<article class="md"><pre><code class="language-' + esc(ext) + '">' + esc(text) + "</code></pre></article>";
      highlight(content.querySelector(".md"));
      document.title = name + " · Rosa's Portfolio";
    }).catch(function (e) { showError(path, e); });
  }

  /* ---------- router ---------- */
  function route() {
    document.body.classList.remove("menu-open");
    var raw = location.hash.replace(/^#\/?/, "").replace(/\/+$/, "");
    var parts = raw ? raw.split("/").map(decodeURIComponent) : [];

    if (parts[0] === "file" && parts.length > 1) {
      renderTopNav(parts[1]);
      renderFile(parts.slice(1).join("/"));
    } else if (parts.length === 0 || !SECTIONS[parts[0]]) {
      renderTopNav("");
      renderSidebar(null);
      renderHome();
    } else {
      renderTopNav(parts[0]);
      renderMarkdown(parts);
    }
    window.scrollTo(0, 0);
  }

  /* ---------- UI wiring ---------- */
  $("menuBtn").addEventListener("click", function () { document.body.classList.toggle("menu-open"); });
  $("themeBtn").addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    syncThemeIcon();
  });
  function syncThemeIcon() {
    $("themeBtn").textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "☀️" : "🌙";
  }
  $("year").textContent = new Date().getFullYear();
  syncThemeIcon();

  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
